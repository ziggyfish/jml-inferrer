services:
  experiment:
    build: .
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./experiment-results:/app/experiment/results
    deploy:
      resources:
        limits:
          memory: 4g

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    deploy:
      resources:
        limits:
          memory: 2g
