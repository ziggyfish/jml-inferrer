services:
  experiment:
    build: .
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./experiment-results:/app/experiment/results
    deploy:
      resources:
        limits:
          memory: 4g

  test:
    build:
      context: .
      # Use the fork-built OpenJML (with \sum/\product/\num_of define-fun-rec
      # support and patched String/Integer specs). Falls back to vanilla via
      # `--file Dockerfile.test`.
      dockerfile: Dockerfile.test.fork
    # Persist the per-test inferred JML and counter-example log to the host so
    # post-run triage can use it. The file is truncated by FormalVerificationTestBase
    # @BeforeAll, then appended to as each test runs. Pre-touch the host file
    # (`touch inferred-specs.log`) before the first run so the bind mount sees
    # a regular file, not a directory.
    volumes:
      - ./inferred-specs.log:/app/inferred-specs.log
    deploy:
      resources:
        limits:
          # 8g for z3-4.13.4 (default) and 4.16.0 — both use materially more
          # memory than z3-4.7.1 (the 2026-04-30 experiment OOM-killed the
          # container at 2g and 6g, third class onward).  z3-4.7.1 fits in 2g
          # if you revert this and switch OPENJML_PROVER=z3-4.7.
          memory: 8g
