# RQ4 self-test: dogfood the reusable workflow on the inferrer's own
# source. Demonstrates end-to-end deployment without recruiting an
# external repository.

name: JML Self-Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  jml:
    uses: ./.github/workflows/jml-verify.yml
    with:
      java-version: '21'
      strict: false
      verify: false
